---
- name: Fail if required strongSwan settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - strongswan_identifier
    - strongswan_uid
    - strongswan_gid
    - strongswan_container_network
    - strongswan_swanctl_conf
    - strongswan_conf
