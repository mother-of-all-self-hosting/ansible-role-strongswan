---
- name: Perform strongSwan installation tasks
  when: strongswan_enabled | bool
  tags:
    - setup-all
    - setup-strongswan
    - install-all
    - install-strongswan
  block:
    - name: Validate strongSwan configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install strongSwan
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform strongSwan uninstallation tasks
  when: not strongswan_enabled | bool
  tags:
    - setup-all
    - setup-strongswan
  block:
    - name: Uninstall strongSwan
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
