---
# Project source code URL: https://github.com/strongswan/strongswan

strongswan_enabled: true

strongswan_identifier: strongswan
strongswan_base_path: "/{{ strongswan_identifier }}"
strongswan_config_path: "{{ strongswan_base_path }}/config"

# renovate: datasource=docker depName=strongx509/strongswan versioning=semver
strongswan_version: 6.1.0

strongswan_uid: ""
strongswan_gid: ""

strongswan_container_image: "{{ strongswan_container_image_registry_prefix }}strongx509/strongswan:{{ strongswan_container_image_tag }}"
strongswan_container_image_tag: "{{ strongswan_version }}"
strongswan_container_image_registry_prefix: "{{ strongswan_container_image_registry_prefix_upstream }}"
strongswan_container_image_registry_prefix_upstream: "{{ strongswan_container_image_registry_prefix_upstream_default }}"
strongswan_container_image_registry_prefix_upstream_default: docker.io/

# The upstream image is only published for amd64. On other architectures, enable self-building.
# The repository's tags do not follow strongSwan's versions (its Dockerfile pins the strongSwan version itself),
# so the build tracks the `master` branch instead of `strongswan_version`.
strongswan_container_image_self_build: false
strongswan_container_image_self_build_name: "strongx509/strongswan:{{ strongswan_container_image_self_build_repo_version }}"
strongswan_container_image_self_build_repo: "https://github.com/strongX509/docker.git"
strongswan_container_image_self_build_repo_version: master
strongswan_container_image_self_build_repo_dockerfile_path: "strongswan/Dockerfile"
strongswan_container_image_self_build_src_files_path: "{{ strongswan_base_path }}/docker-src"

# The base container network. It will be auto-created by this role if it doesn't exist already.
#
# IPsec tunnels end in the network namespace of the container, so on a dedicated network only the container's own traffic can use them.
# Site-to-site and road warrior setups need 'host' instead, which lets strongSwan manage the IPsec policies of the host itself.
# With host networking no ports are published, so open them in the firewall yourself.
strongswan_container_network: "{{ strongswan_identifier }}"

# Control if the container network is deleted on uninstalling.
strongswan_container_network_deletion_enabled: true

# Controls whether the strongSwan container exposes its IKE port (udp/500 in the container).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "500"), or an empty string to not expose.
strongswan_container_ike_host_bind_port: "{{ '500' if strongswan_container_network != 'host' else '' }}"

# Controls whether the strongSwan container exposes its NAT traversal port (udp/4500 in the container).
#
# Peers see Docker's port publishing as NAT, so ESP is encapsulated in UDP on this port.
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "4500"), or an empty string to not expose.
strongswan_container_nat_traversal_host_bind_port: "{{ '4500' if strongswan_container_network != 'host' else '' }}"

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
strongswan_container_additional_networks: "{{ strongswan_container_additional_networks_auto + strongswan_container_additional_networks_custom }}"
strongswan_container_additional_networks_auto: []
strongswan_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
#
# Use this to mount certificates and keys under `/etc/swanctl` (e.g. `/etc/swanctl/x509`, `/etc/swanctl/private`),
# or additional swanctl configuration snippets under `/etc/swanctl/conf.d`.
strongswan_container_additional_volumes: "{{ strongswan_container_additional_volumes_auto + strongswan_container_additional_volumes_custom }}"
strongswan_container_additional_volumes_auto: []
strongswan_container_additional_volumes_custom: []

# Specify the size of the container's tmpfs volume (/run)
strongswan_container_tmpfs_run_size: 64m

# A list of extra arguments to pass to the container (`docker create` command)
strongswan_container_extra_arguments: "{{ strongswan_container_extra_arguments_auto + strongswan_container_extra_arguments_custom }}"
strongswan_container_extra_arguments_auto: []
strongswan_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
strongswan_process_extra_arguments: "{{ strongswan_process_extra_arguments_auto + strongswan_process_extra_arguments_custom }}"
strongswan_process_extra_arguments_auto: []
strongswan_process_extra_arguments_custom: []

# List of systemd services that the strongSwan systemd service depends on
strongswan_systemd_required_services_list: "{{ strongswan_systemd_required_services_list_default + strongswan_systemd_required_services_list_auto + strongswan_systemd_required_services_list_custom }}"
strongswan_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
strongswan_systemd_required_services_list_auto: []
strongswan_systemd_required_services_list_custom: []

# List of systemd services that the strongSwan systemd service wants
strongswan_systemd_wanted_services_list: "{{ strongswan_systemd_wanted_services_list_default + strongswan_systemd_wanted_services_list_auto + strongswan_systemd_wanted_services_list_custom }}"
strongswan_systemd_wanted_services_list_default: []
strongswan_systemd_wanted_services_list_auto: []
strongswan_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
strongswan_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
strongswan_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
strongswan_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
strongswan_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ strongswan_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ strongswan_container_stop_grace_time_seconds }} {{ strongswan_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ strongswan_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ strongswan_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ strongswan_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ strongswan_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ strongswan_identifier }} after {{ strongswan_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specifies the contents of `swanctl.conf`, which holds the connections, secrets, pools and authorities.
# Snippets mounted at `/etc/swanctl/conf.d` (see `strongswan_container_additional_volumes`) are loaded too,
# so this may be left empty when all of the configuration lives there.
# Documentation: https://docs.strongswan.org/docs/latest/swanctl/swanctlConf.html
#
# Example:
# strongswan_swanctl_conf: |
#   connections {
#     site-to-site {
#       version = 2
#       remote_addrs = 203.0.113.10
#       local {
#         auth = psk
#         id = vpn.example.com
#       }
#       remote {
#         auth = psk
#         id = vpn.example.net
#       }
#       children {
#         site-to-site {
#           local_ts = 10.0.1.0/24
#           remote_ts = 10.0.2.0/24
#           start_action = start
#         }
#       }
#     }
#   }
#
#   secrets {
#     ike-site-to-site {
#       id = vpn.example.net
#       secret = "SECRET_HERE"
#     }
#   }
strongswan_swanctl_conf: ""

# Specifies the contents of `strongswan.conf`, which configures the charon daemon itself.
# Documentation: https://docs.strongswan.org/docs/latest/config/strongswanConf.html
#
# The value replaces the whole file. Keep the start script, which loads `swanctl.conf` when the daemon starts,
# and the stderr logging, which sends the logs to the systemd journal (there is no syslog in the container).
strongswan_conf: |
  charon {
    start-scripts {
      swanctl = swanctl --load-all --noprompt
    }
    filelog {
      stderr {
        default = 1
      }
    }
  }

# Specify the timezone
strongswan_environment_variables_tz: UTC

# Additional environment variables.
strongswan_environment_variables_additional_variables: ""

# strongswan_restart_necessary controls whether the strongSwan systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
strongswan_restart_necessary: false
