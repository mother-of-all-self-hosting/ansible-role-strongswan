---
- name: Prepare strongSwan Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for strongSwan Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for strongSwan Molecule tests preparation
      ansible.builtin.package:
        name:
          # Used by the community.docker modules the role runs.
          - python3-requests
        state: present

    - name: Ensure Docker is installed for strongSwan Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker

    # Bind-mounted into the strongSwan container through
    # `strongswan_container_additional_volumes_custom`. The role does not create the source
    # of an additional volume, so it has to exist before the container is
    # created, or `docker create` refuses the bind. verify.yml reads the marker
    # file back from inside the container, which only works if the systemd unit
    # really carries the additional volumes.
    - name: Ensure the additional volume directory exists for strongSwan Molecule tests
      ansible.builtin.file:
        path: "{{ strongswan_molecule_extra_volume_src }}"
        state: directory
        mode: "0755"

    - name: Ensure a marker file exists in the strongSwan Molecule additional volume
      ansible.builtin.copy:
        content: "{{ strongswan_molecule_extra_volume_marker }}\n"
        dest: "{{ strongswan_molecule_extra_volume_src }}/{{ strongswan_molecule_marker_filename }}"
        mode: "0644"
